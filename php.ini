;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Custom PHP configuration for PHP 8.3 (Alpine)
; Path: /etc/php83/conf.d/custom.ini
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Date]
date.timezone = UTC

[PHP]
expose_php = Off
memory_limit = 1024M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 20M
display_errors = Off
log_errors = On
error_log = /var/log/php-error.log

[Session]
session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 1440

[OPcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.revalidate_freq = 10
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 192
opcache.max_wasted_percentage = 10
opcache.interned_strings_buffer = 16
opcache.fast_shutdown = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Extension enabling
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

extension=bcmath
extension=ctype
extension=curl
extension=dom
extension=fileinfo
extension=gd
extension=iconv
extension=intl
extension=mbstring
extension=openssl
extension=pdo
extension=pdo_sqlite
extension=phar
extension=session
extension=simplexml
extension=tokenizer
extension=xml
extension=xmlreader
extension=xmlwriter
extension=zip
extension=pcntl

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Recommended CLI tweaks (optional, safe defaults)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

cli_server.color = On
report_memleaks = On
html_errors = Off
serialize_precision = -1
