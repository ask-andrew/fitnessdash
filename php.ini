[Date]
date.timezone="UTC"
expose_php= Off

memory_limit=1024M

opcache.enable=1
opcache.revalidate_freq=10
opcache.validate_timestamps=1
opcache.max_accelerated_files=10000
opcache.memory_consumption=192
opcache.max_wasted_percentage=10
opcache.interned_strings_buffer=1
opcache.fast_shutdown=1

upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120

; Enable all required extensions for PHP 8.3
extension=bcmath
extension=ctype
extension=dom
extension=fileinfo
extension=iconv
extension=intl
extension=mbstring
extension=openssl
extension=pdo
extension=pdo_sqlite
extension=phar
extension=session
extension=simplexml
extension=tokenizer
extension=xml
extension=xmlreader
extension=xmlwriter
extension=zip
extension=pcntl
